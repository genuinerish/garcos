<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Garcos Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        @keyframes shine {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .shiny-brand {
            background: linear-gradient(90deg, rgba(15, 23, 42, 1) 0%, rgba(255, 255, 255, 0.4) 25%, rgba(15, 23, 42, 1) 50%, rgba(255, 255, 255, 0.4) 75%, rgba(15, 23, 42, 1) 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- Navbar -->
    <header class="bg-white/80 backdrop-blur-md text-slate-900 py-4 px-6 sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-base font-black tracking-wider uppercase shiny-brand">Garcos Pro</a>
            <a href="index.html"
                class="text-xs font-bold text-slate-600 hover:text-slate-900 flex items-center gap-1.5 transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </header>

    <!-- Main Login Container -->
    <main class="flex-grow flex items-center justify-center py-16 px-6">
        <div class="bg-white rounded-3xl border border-slate-200 p-8 max-w-md w-full shadow-sm space-y-6">
            <div class="text-center space-y-2">
                <div
                    class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 px-3.5 py-1.5 rounded-full text-xs font-black uppercase tracking-wider">
                    <i class="fa-solid fa-right-to-bracket text-emerald-600"></i> Member Sign In
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Access Your Workspace</h1>
                <p class="text-xs text-slate-500">Enter your registered corporate email to verify via OTP.</p>
            </div>

            <!-- Step 1: Email Form -->
            <form id="login-step-email" onsubmit="handleEmailSubmit(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700">Corporate Email Address</label>
                    <input type="email" id="login-email-input" required placeholder="name@company.com"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all">
                </div>

                <button type="submit" id="login-send-btn"
                    class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-black uppercase tracking-wider rounded-2xl transition-all shadow-sm">
                    Send Login OTP
                </button>

                <div class="text-center pt-2">
                    <p class="text-[11px] text-slate-500">Don't have an active subscription? <a href="paymentplan.html"
                            class="text-emerald-600 font-bold hover:underline">Choose a plan</a></p>
                </div>
            </form>

            <!-- Step 2: 6-Box OTP Verification Form -->
            <div id="login-step-otp" class="space-y-5 hidden">
                <div
                    class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-[11px] text-emerald-800 font-medium text-center">
                    OTP sent to <span id="login-displayed-email" class="font-bold underline"></span>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-700 text-center">Enter 6-Digit Verification
                        Code</label>
                    <div class="flex justify-center gap-2 sm:gap-3" id="otp-inputs-container">
                        <input type="text" maxlength="1"
                            class="otp-box w-11 h-12 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-black text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"
                            inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
                        <input type="text" maxlength="1"
                            class="otp-box w-11 h-12 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-black text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"
                            inputmode="numeric" pattern="[0-9]*">
                        <input type="text" maxlength="1"
                            class="otp-box w-11 h-12 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-black text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"
                            inputmode="numeric" pattern="[0-9]*">
                        <input type="text" maxlength="1"
                            class="otp-box w-11 h-12 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-black text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"
                            inputmode="numeric" pattern="[0-9]*">
                        <input type="text" maxlength="1"
                            class="otp-box w-11 h-12 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-black text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"
                            inputmode="numeric" pattern="[0-9]*">
                        <input type="text" maxlength="1"
                            class="otp-box w-11 h-12 bg-slate-50 border border-slate-200 rounded-xl text-center text-lg font-black text-slate-900 focus:outline-none focus:border-emerald-600 focus:bg-white transition-all"
                            inputmode="numeric" pattern="[0-9]*">
                    </div>
                </div>

                <button onclick="verifyLoginOtp()"
                    class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black uppercase tracking-wider rounded-2xl transition-all shadow-lg shadow-emerald-600/30">
                    Verify & Enter Workspace
                </button>

                <div class="text-center">
                    <button onclick="resetLoginForm()"
                        class="text-[11px] font-bold text-slate-500 hover:text-slate-900 underline transition-colors">
                        Use a different email address
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-slate-500 py-8 px-6 text-center text-xs border-t border-slate-200">
        <p>© 2026 Garcos Enterprise Pro · A Sub-Brand Product of Fashmer</p>
    </footer>

    <script>
        let attemptingEmail = '';

        async function handleEmailSubmit(e) {
            e.preventDefault();
            attemptingEmail = document.getElementById('login-email-input').value.trim();

            if (!attemptingEmail || !attemptingEmail.includes('@')) {
                alert('Please enter a valid corporate email address.');
                return;
            }

            const existingUser = localStorage.getItem('garcos_user_' + attemptingEmail);
            if (!existingUser) {
                alert('No account found for this email address. Redirecting to subscription plans.');
                window.location.href = 'paymentplan.html';
                return;
            }

            const btn = document.getElementById('login-send-btn');
            btn.innerText = 'Sending OTP...';
            btn.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: attemptingEmail })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send login OTP');
                }

                document.getElementById('login-displayed-email').innerText = attemptingEmail;
                document.getElementById('login-step-email').classList.add('hidden');
                document.getElementById('login-step-otp').classList.remove('hidden');

                setTimeout(() => {
                    const firstBox = document.querySelector('.otp-box');
                    if (firstBox) firstBox.focus();
                }, 100);

            } catch (error) {
                alert('Error sending OTP: ' + error.message);
            } finally {
                btn.innerText = 'Send Login OTP';
                btn.disabled = false;
            }
        }

        function resetLoginForm() {
            document.getElementById('login-step-otp').classList.add('hidden');
            document.getElementById('login-step-email').classList.remove('hidden');
            document.getElementById('login-email-input').value = '';
            document.querySelectorAll('.otp-box').forEach(box => box.value = '');
        }

        const otpBoxes = document.querySelectorAll('.otp-box');
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && !isNaN(val)) {
                    e.target.value = val;
                    if (index < otpBoxes.length - 1) {
                        otpBoxes[index + 1].focus();
                    }
                } else {
                    e.target.value = '';
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (box.value === '' && index > 0) {
                        otpBoxes[index - 1].focus();
                        otpBoxes[index - 1].value = '';
                    } else {
                        box.value = '';
                    }
                } else if (e.key === 'Enter') {
                    verifyLoginOtp();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').trim();
                if (/^\d{6}$/.test(pasteData)) {
                    otpBoxes.forEach((b, idx) => {
                        b.value = pasteData[idx];
                    });
                    otpBoxes[otpBoxes.length - 1].focus();
                }
            });
        });

        async function verifyLoginOtp() {
            let enteredOtp = '';
            otpBoxes.forEach(box => {
                enteredOtp += box.value;
            });

            if (enteredOtp.length < 6) {
                alert('Please enter the complete 6-digit verification code.');
                return;
            }

            try {
                const response = await fetch('/.netlify/functions/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: attemptingEmail, otp: enteredOtp })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Invalid or expired OTP code.');
                }

                const userRecordStr = localStorage.getItem('garcos_user_' + attemptingEmail);
                if (userRecordStr) {
                    const userRecord = JSON.parse(userRecordStr);

                    if (userRecord.status === 'pending_payment') {
                        alert('Your previous payment was not completed. Redirecting to complete checkout.');
                        window.location.href = 'paymentplan.html';
                        return;
                    }

                    if (userRecord.expiresAt && new Date() > new Date(userRecord.expiresAt)) {
                        userRecord.status = 'expired';
                        localStorage.setItem('garcos_user_' + attemptingEmail, JSON.stringify(userRecord));
                        alert('Your 28-day subscription has expired. Please renew.');
                        window.location.href = 'paymentplan.html';
                        return;
                    }

                    localStorage.setItem('garcos_active_session', JSON.stringify(userRecord));
                    alert('Login Successful! Welcome back, ' + userRecord.company);
                    window.location.href = 'app.html';
                } else {
                    alert('Account record not found. Please select a subscription plan first.');
                    window.location.href = 'paymentplan.html';
                }

            } catch (error) {
                alert('Verification failed: ' + error.message);
            }
        }
    </script>
</body>

</html>
