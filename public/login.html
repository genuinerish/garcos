<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garcos Pro - Secure Sign In</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: #f0fdf4;
            color: #064e3b;
        }
    </style>
</head>

<body class="selection:bg-emerald-600 selection:text-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white border border-emerald-300 rounded-3xl p-8 shadow-xl space-y-6 relative">

        <!-- Header -->
        <div class="text-center space-y-2">
            <div
                class="inline-flex bg-emerald-100 text-emerald-700 p-3 rounded-2xl border border-emerald-300 shadow-sm">
                <i class="fa-solid fa-calculator text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-emerald-950 tracking-tight">Garcos Enterprise Pro</h1>
            <p class="text-xs text-emerald-800/80 font-medium">Sign in or create account with your Gmail address</p>
        </div>

        <!-- Step 1: Email & OTP Request Form -->
        <div id="email-section" class="space-y-4">
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-emerald-800 mb-1">Gmail
                    Address</label>
                <input type="email" id="user-email" placeholder="name@gmail.com"
                    class="w-full px-4 py-3 bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 placeholder-emerald-800/40 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all">
            </div>
            <button onclick="sendOtp()" id="send-otp-btn"
                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl transition-all shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                <span>Continue with Gmail OTP</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
        </div>

        <!-- Step 2: OTP Verification & Plan Selection (Hidden initially) -->
        <div id="otp-section" class="space-y-4 hidden">
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-emerald-800 mb-1">Enter
                    6-Digit OTP</label>
                <input type="text" id="otp-code" maxlength="6" placeholder="123456"
                    class="w-full px-4 py-3 bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 placeholder-emerald-800/40 text-center tracking-widest text-lg font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all">
            </div>
            <button onclick="verifyOtp()" id="verify-otp-btn"
                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl transition-all shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                <span>Verify OTP & Sign In</span> <i class="fa-solid fa-check text-[10px]"></i>
            </button>
        </div>

        <!-- Step 3: Subscription Tiers (Visible after login if trial expired or plan needed) -->
        <div id="subscription-section" class="space-y-3 hidden border-t border-emerald-100 pt-4">
            <p class="text-xs font-bold text-emerald-900 text-center">Select Your Subscription Plan</p>

            <button onclick="initRazorpayPayment('basic')"
                class="w-full p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-xl flex items-center justify-between text-left transition-all">
                <div>
                    <div class="text-xs font-black text-emerald-950">Basic Plan</div>
                    <div class="text-[10px] text-emerald-800/80">Single garment calculation</div>
                </div>
                <span class="text-xs font-black text-emerald-700">₹399 / mo</span>
            </button>

            <button onclick="initRazorpayPayment('premium')"
                class="w-full p-3 bg-emerald-600 text-white rounded-xl flex items-center justify-between text-left shadow-md transition-all">
                <div>
                    <div class="text-xs font-black">Premium Monthly Plan</div>
                    <div class="text-[10px] text-emerald-100">Full calculation suite</div>
                </div>
                <span class="text-xs font-black">₹459 / mo</span>
            </button>

            <button onclick="initRazorpayPayment('pro_quarterly')"
                class="w-full p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-xl flex items-center justify-between text-left transition-all">
                <div>
                    <div class="text-xs font-black text-emerald-950">3 Months Quarterly Plan</div>
                    <div class="text-[10px] text-emerald-800/80">Continuous multi-month access</div>
                </div>
                <span class="text-xs font-black text-emerald-700">₹1,299 / 3mo</span>
            </button>
        </div>

        <!-- Back to Home link -->
        <div class="text-center pt-2">
            <a href="/index.html"
                class="text-xs text-emerald-800 hover:text-emerald-950 font-bold transition-all flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Pricing & Home
            </a>
        </div>

    </div>

    <!-- JavaScript Handlers -->
    <script>
        let userEmail = "";

        async function sendOtp() {
            userEmail = document.getElementById('user-email').value.trim();
            if (!userEmail) {
                alert('Please enter your Gmail address.');
                return;
            }

            const btn = document.getElementById('send-otp-btn');
            btn.innerText = 'Sending OTP...';
            btn.disabled = true;

            try {
                const res = await fetch('/.netlify/functions/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('email-section').classList.add('hidden');
                    document.getElementById('otp-section').classList.remove('hidden');
                    alert('OTP sent to your email inbox!');
                } else {
                    alert(data.error || 'Failed to send OTP.');
                }
            } catch (err) {
                alert('Connection error while sending OTP.');
            } finally {
                btn.innerText = 'Continue with Gmail OTP';
                btn.disabled = false;
            }
        }

        async function verifyOtp() {
            const otp = document.getElementById('otp-code').value.trim();
            if (!otp || otp.length !== 6) {
                alert('Please enter a valid 6-digit OTP.');
                return;
            }

            const btn = document.getElementById('verify-otp-btn');
            btn.innerText = 'Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch('/.netlify/functions/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp: otp })
                });
                const data = await res.json();

                if (res.ok) {
                    if (data.hasActiveAccess) {
                        // Active trial or subscription exists -> Redirect straight to calculation dashboard
                        window.location.href = '/app.html';
                    } else {
                        // Trial expired -> Show subscription selection modal/tiers
                        document.getElementById('otp-section').classList.add('hidden');
                        document.getElementById('subscription-section').classList.remove('hidden');
                        alert('Trial period ended. Please select a subscription plan to continue.');
                    }
                } else {
                    alert(data.error || 'Invalid OTP.');
                }
            } catch (err) {
                alert('Connection error during verification.');
            } finally {
                btn.innerText = 'Verify OTP & Sign In';
                btn.disabled = false;
            }
        }

        async function initRazorpayPayment(planType) {
            try {
                const orderRes = await fetch('/.netlify/functions/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, planType: planType })
                });
                const order = await orderRes.json();

                if (!orderRes.ok) {
                    alert(order.error || 'Could not create order.');
                    return;
                }

                const options = {
                    key: "YOUR_RAZORPAY_KEY_ID",
                    amount: order.amount,
                    currency: "INR",
                    name: "Garcos Enterprise Pro",
                    description: "Subscription License",
                    order_id: order.id,
                    handler: function (response) {
                        alert('Payment Successful! Welcome to Garcos Pro.');
                        window.location.href = '/app.html';
                    },
                    prefill: { email: userEmail },
                    theme: { color: "#059669" }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            } catch (err) {
                alert('Could not initialize payment gateway.');
            }
        }
    </script>

    <!-- FOOTER -->
    <footer class="fixed bottom-2 text-center text-[10px] text-emerald-900/60 font-semibold w-full">
        © 2026 Garcos Enterprise Pro · Conceptualized & Steered by Fashmer
    </footer>

</body>

</html>
