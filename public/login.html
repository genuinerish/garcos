<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashmar Pro - Secure Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: #f0fdf4;
            color: #064e3b;
        }

        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="selection:bg-emerald-600 selection:text-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white border border-emerald-300 rounded-3xl p-8 shadow-xl space-y-6 relative">

        <!-- Header with Fashmar Logo Image -->
        <div class="text-center space-y-2">
            <div class="flex justify-center mb-2">
                <img src="https://imglink.cc/cdn/nHfc8Ym7TU.png" alt="Fashmar Logo" class="h-12 w-auto object-contain">
            </div>
            <h1 class="text-2xl font-black text-emerald-950 tracking-tight">Fashmar Enterprise Pro</h1>
            <p class="text-xs text-emerald-800/80 font-medium">Professional Garment Costing Suite Authentication</p>
        </div>

        <!-- Status Banner -->
        <div id="status-banner" class="hidden p-3 rounded-xl text-xs font-bold text-center transition-all"></div>

        <!-- Auth Form -->
        <div id="auth-form-container" class="space-y-4">
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-emerald-800 mb-1">Full
                    Name</label>
                <input type="text" id="user-name" placeholder="Enter your full name"
                    class="w-full px-4 py-3 bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 placeholder-emerald-800/40 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all">
            </div>

            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-emerald-800 mb-1">Gmail
                    Address</label>
                <input type="email" id="user-email" placeholder="name@gmail.com"
                    class="w-full px-4 py-3 bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 placeholder-emerald-800/40 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all">
            </div>

            <!-- 6-Box Individual OTP Section -->
            <div id="otp-group" class="hidden space-y-2">
                <label
                    class="block text-[11px] font-extrabold uppercase tracking-wider text-emerald-800 text-center mb-1">Enter
                    6-Digit Verification Code</label>
                <div class="flex justify-between gap-2">
                    <input type="text" maxlength="1"
                        class="otp-input w-12 h-12 text-center bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 text-xl font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all"
                        oninput="handleOtpInput(this, 0)" onkeydown="handleOtpKeyDown(event, 0)">
                    <input type="text" maxlength="1"
                        class="otp-input w-12 h-12 text-center bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 text-xl font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all"
                        oninput="handleOtpInput(this, 1)" onkeydown="handleOtpKeyDown(event, 1)">
                    <input type="text" maxlength="1"
                        class="otp-input w-12 h-12 text-center bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 text-xl font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all"
                        oninput="handleOtpInput(this, 2)" onkeydown="handleOtpKeyDown(event, 2)">
                    <input type="text" maxlength="1"
                        class="otp-input w-12 h-12 text-center bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 text-xl font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all"
                        oninput="handleOtpInput(this, 3)" onkeydown="handleOtpKeyDown(event, 3)">
                    <input type="text" maxlength="1"
                        class="otp-input w-12 h-12 text-center bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 text-xl font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all"
                        oninput="handleOtpInput(this, 4)" onkeydown="handleOtpKeyDown(event, 4)">
                    <input type="text" maxlength="1"
                        class="otp-input w-12 h-12 text-center bg-emerald-50/55 border border-emerald-300 rounded-xl text-emerald-950 text-xl font-black focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all"
                        oninput="handleOtpInput(this, 5)" onkeydown="handleOtpKeyDown(event, 5)">
                </div>
            </div>

            <button onclick="handleAuthAction()" id="action-btn"
                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl transition-all shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                <span id="btn-text">Send Verification OTP</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
        </div>

        <!-- Subscription Plans Section -->
        <div id="subscription-section" class="space-y-3 hidden border-t border-emerald-100 pt-4">
            <p class="text-xs font-bold text-emerald-900 text-center">Your Trial Has Ended. Select a Plan:</p>

            <button onclick="initRazorpayPayment('basic')"
                class="w-full p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-xl flex items-center justify-between text-left transition-all">
                <div>
                    <div class="text-xs font-black text-emerald-950">Basic Plan</div>
                    <div class="text-[10px] text-emerald-800/80">Single garment calculation</div>
                </div>
                <span class="text-xs font-black text-emerald-700">₹399 / mo</span>
            </button>

            <button onclick="initRazorpayPayment('premium')"
                class="w-full p-3 bg-emerald-600 text-white rounded-xl flex items-center justify-between text-left shadow-md transition-all">
                <div>
                    <div class="text-xs font-black">Premium Monthly Plan</div>
                    <div class="text-[10px] text-emerald-100">Full calculation suite</div>
                </div>
                <span class="text-xs font-black">₹459 / mo</span>
            </button>

            <button onclick="initRazorpayPayment('pro_quarterly')"
                class="w-full p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-xl flex items-center justify-between text-left transition-all">
                <div>
                    <div class="text-xs font-black text-emerald-950">3 Months Quarterly Plan</div>
                    <div class="text-[10px] text-emerald-800/80">Continuous multi-month access</div>
                </div>
                <span class="text-xs font-black text-emerald-700">₹1,299 / 3mo</span>
            </button>
        </div>

        <!-- Back to Home -->
        <div class="text-center pt-2">
            <a href="/index.html"
                class="text-xs text-emerald-800 hover:text-emerald-950 font-bold transition-all flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Pricing & Home
            </a>
        </div>

    </div>

    <script>
        let isOtpStep = false;
        let userName = "";
        let userEmail = "";

        function showStatus(message, type = 'info') {
            const banner = document.getElementById('status-banner');
            banner.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-red-100', 'text-red-800', 'bg-emerald-600', 'text-white');
            if (type === 'error') {
                banner.className = 'p-3 rounded-xl text-xs font-bold text-center bg-red-100 text-red-800 border border-red-300';
            } else if (type === 'success') {
                banner.className = 'p-3 rounded-xl text-xs font-bold text-center bg-emerald-100 text-emerald-800 border border-emerald-300';
            } else {
                banner.className = 'p-3 rounded-xl text-xs font-bold text-center bg-emerald-600 text-white';
            }
            banner.innerText = message;
        }

        function handleOtpInput(element, index) {
            const value = element.value;
            if (value && index < 5) {
                document.querySelectorAll('.otp-input')[index + 1].focus();
            }
        }

        function handleOtpKeyDown(event, index) {
            if (event.key === 'Backspace' && !event.target.value && index > 0) {
                document.querySelectorAll('.otp-input')[index - 1].focus();
            }
        }

        function getCompleteOtp() {
            let otp = '';
            document.querySelectorAll('.otp-input').forEach(input => otp += input.value);
            return otp;
        }

        async function handleAuthAction() {
            userName = document.getElementById('user-name').value.trim();
            userEmail = document.getElementById('user-email').value.trim();

            if (!userName || !userEmail) {
                showStatus('Please enter both your full name and Gmail address.', 'error');
                return;
            }

            if (!isOtpStep) {
                const btn = document.getElementById('action-btn');
                btn.disabled = true;
                showStatus('Sending verification code to your inbox...', 'info');

                try {
                    const res = await fetch('/.netlify/functions/send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: userEmail, name: userName })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        isOtpStep = true;
                        document.getElementById('user-name').disabled = true;
                        document.getElementById('user-email').disabled = true;
                        document.getElementById('otp-group').classList.remove('hidden');
                        document.getElementById('btn-text').innerText = 'Verify & Access App';
                        showStatus('Verification code sent! Check your email.', 'success');
                        document.querySelectorAll('.otp-input')[0].focus();
                    } else {
                        showStatus(data.error || 'Failed to send OTP.', 'error');
                    }
                } catch (err) {
                    showStatus('Connection error while sending OTP.', 'error');
                } finally {
                    btn.disabled = false;
                }
            } else {
                const otp = getCompleteOtp();
                if (!otp || otp.length !== 6) {
                    showStatus('Please enter all 6 digits of the verification code.', 'error');
                    return;
                }

                const btn = document.getElementById('action-btn');
                btn.disabled = true;
                showStatus('Verifying credentials...', 'info');

                try {
                    const res = await fetch('/.netlify/functions/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: userEmail, name: userName, otp: otp })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        if (data.hasActiveAccess) {
                            showStatus('Access granted! Redirecting to dashboard...', 'success');
                            setTimeout(() => { window.location.href = '/app.html'; }, 800);
                        } else {
                            document.getElementById('auth-form-container').classList.add('hidden');
                            document.getElementById('subscription-section').classList.remove('hidden');
                            showStatus('Your 25-day trial period has ended. Please choose a plan.', 'error');
                        }
                    } else {
                        showStatus(data.error || 'Invalid OTP code.', 'error');
                    }
                } catch (err) {
                    showStatus('Connection error during verification.', 'error');
                } finally {
                    btn.disabled = false;
                }
            }
        }

        async function initRazorpayPayment(planType) {
            try {
                const orderRes = await fetch('/.netlify/functions/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, planType: planType })
                });
                const order = await orderRes.json();

                if (!orderRes.ok) {
                    showStatus(order.error || 'Could not create payment order.', 'error');
                    return;
                }

                const options = {
                    key: order.keyId,
                    amount: order.amount,
                    currency: "INR",
                    name: "Fashmar Enterprise Pro",
                    description: "Subscription License",
                    order_id: order.id,
                    handler: function (response) {
                        showStatus('Payment Successful! Unlocking app...', 'success');
                        setTimeout(() => { window.location.href = '/app.html'; }, 1000);
                    },
                    prefill: { name: userName, email: userEmail },
                    theme: { color: "#059669" }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            } catch (err) {
                showStatus('Could not initialize payment gateway.', 'error');
            }
        }
    </script>
</body>

</html>
