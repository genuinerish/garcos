<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garcos - Direct Subscription Purchase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-emerald-50/30 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-emerald-200 rounded-3xl p-8 shadow-2xl space-y-6 relative">

        <!-- Brand Logo -->
        <div class="text-center space-y-2">
            <img src="https://imglink.cc/cdn/y7AehhL5xW.jpeg" alt="Garcos Logo"
                class="h-16 w-auto mx-auto object-contain rounded-xl">
            <h1 class="text-2xl font-black tracking-tight text-emerald-950">Select a Plan</h1>
            <p class="text-xs text-emerald-800/80 font-medium">Skip the trial and secure permanent access instantly</p>
        </div>

        <!-- Email Input for Payment Mapping -->
        <div>
            <label class="block text-xs font-bold text-emerald-950 mb-1">Your Email Address</label>
            <input type="email" id="payment-email" required placeholder="name@company.com"
                class="w-full bg-emerald-50/50 border border-emerald-200 rounded-xl px-4 py-3 text-emerald-950 placeholder-emerald-400 focus:outline-none focus:border-emerald-600 text-sm">
        </div>

        <!-- Pricing Options -->
        <div class="space-y-3">
            <!-- Basic Plan -->
            <button type="button" onclick="initRazorpayPayment('basic')"
                class="w-full text-left p-4 rounded-xl bg-emerald-50/40 hover:bg-emerald-50 border border-emerald-200 hover:border-emerald-600 transition-all flex items-center justify-between group">
                <div>
                    <div class="text-sm font-bold text-emerald-950 group-hover:text-emerald-700">Basic Plan</div>
                    <div class="text-[11px] text-emerald-800/80">Monthly access & core features</div>
                </div>
                <div class="text-right">
                    <div class="text-sm font-bold text-emerald-600">₹399</div>
                    <div class="text-[10px] text-emerald-800/60">Pay Now →</div>
                </div>
            </button>

            <!-- Premium Plan -->
            <button type="button" onclick="initRazorpayPayment('premium')"
                class="w-full text-left p-4 rounded-xl bg-emerald-50/40 hover:bg-emerald-50 border border-emerald-200 hover:border-emerald-600 transition-all flex items-center justify-between group">
                <div>
                    <div class="text-sm font-bold text-emerald-950 group-hover:text-emerald-700">Premium Plan</div>
                    <div class="text-[11px] text-emerald-800/80">Advanced tools & priority speed</div>
                </div>
                <div class="text-right">
                    <div class="text-sm font-bold text-emerald-600">₹459</div>
                    <div class="text-[10px] text-emerald-800/60">Pay Now →</div>
                </div>
            </button>

            <!-- Quarterly Plan -->
            <button type="button" onclick="initRazorpayPayment('pro_quarterly')"
                class="w-full text-left p-4 rounded-xl bg-emerald-600/10 hover:bg-emerald-600/20 border border-emerald-300 transition-all flex items-center justify-between group">
                <div>
                    <div class="text-sm font-bold text-emerald-950 group-hover:text-emerald-700">Quarterly Pro <span
                            class="text-[10px] bg-emerald-600 text-white px-1.5 py-0.5 rounded ml-1 font-semibold">Best
                            Value</span></div>
                    <div class="text-[11px] text-emerald-800/80">3 Months full license</div>
                </div>
                <div class="text-right">
                    <div class="text-sm font-bold text-emerald-600">₹1,299</div>
                    <div class="text-[10px] text-emerald-700 font-medium">Pay Now →</div>
                </div>
            </button>
        </div>

        <!-- Footer Links -->
        <div class="text-center pt-2 border-t border-emerald-100 flex items-center justify-between">
            <a href="/index.html"
                class="text-xs text-emerald-800 hover:text-emerald-950 font-medium transition-all inline-flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Home
            </a>
            <a href="/login.html" class="text-xs font-bold text-emerald-600 hover:text-emerald-700 transition-all">
                Login / Free Trial →
            </a>
        </div>
    </div>

    <script>
        async function initRazorpayPayment(planType) {
            const emailInput = document.getElementById('payment-email');
            const email = emailInput ? emailInput.value.trim() : '';

            if (!email || !email.includes('@')) {
                alert("Please enter a valid email address first to proceed with payment.");
                emailInput.focus();
                return;
            }

            localStorage.setItem('garcos_user_email', email);

            try {
                const orderRes = await fetch('/.netlify/functions/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, planType: planType })
                });
                const order = await orderRes.json();

                if (!orderRes.ok) {
                    alert(order.error || 'Could not create payment order.');
                    return;
                }

                const options = {
                    key: order.keyId,
                    amount: order.amount,
                    currency: "INR",
                    name: "Garcos Enterprise Pro",
                    description: "Subscription License",
                    order_id: order.id,
                    handler: async function (response) {
                        alert('Payment Successful! Unlocking your account...');
                        localStorage.setItem('garcos_user_email', email);
                        window.location.href = '/app.html';
                    },
                    prefill: { email: email },
                    theme: { color: "#059669" }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            } catch (err) {
                alert('Could not initialize payment gateway.');
            }
        }
    </script>
</body>

</html>
